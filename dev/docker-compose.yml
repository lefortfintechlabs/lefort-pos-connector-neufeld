# SQL Server 2022 EDICIÓN EXPRESS para pruebas locales (mismas limitaciones que el POS: sin CDC, sin Agent).
# Apple Silicon: la imagen es x86-64. Docker Desktop -> Settings -> General ->
# "Use Rosetta for x86_64/amd64 emulation on Apple Silicon". Asigne al menos 3 GB de RAM a Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: lefort-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "Lefort_Sa_Passw0rd!"
    ports:
      - "1433:1433"
